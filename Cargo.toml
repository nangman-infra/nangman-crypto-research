[package]
name = "research-app"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.94"
default-run = "research-app"

[dependencies]
aws-config = { version = "1.8.16", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.131.0"
aws-types = "1.3.10"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread"] }
