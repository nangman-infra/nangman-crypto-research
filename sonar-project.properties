sonar.projectKey=nangman-crypto-research
sonar.projectName=nangman-crypto-research
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8

sonar.sources=src,ecs,.github/workflows
sonar.tests=src
sonar.test.inclusions=src/cli_tests.rs,src/cli_tests/**/*.rs,src/**/tests.rs,src/**/tests/*.rs,src/**/tests/**/*.rs,src/**/*_tests.rs
sonar.exclusions=target/**,sonar-reports/**,src/cli_tests.rs,src/cli_tests/**/*.rs,src/**/tests.rs,src/**/tests/*.rs,src/**/tests/**/*.rs,src/**/*_tests.rs
sonar.coverage.exclusions=ecs/**,.github/**,src/storage.rs,src/main.rs,src/cli_tests.rs,src/cli_tests/**/*.rs,src/**/tests.rs,src/**/tests/*.rs,src/**/tests/**/*.rs,src/**/*_tests.rs

sonar.rust.cargo.manifestPaths=Cargo.toml
sonar.rust.clippy.enabled=false
sonar.rust.clippyReport.reportPaths=sonar-reports/clippy.json
sonar.rust.lcov.reportPaths=sonar-reports/lcov.info
